name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portfolio (static prerender)
        run: npm run build
        env:
          BASE_PATH: /pixel-perfect-clone/

      - name: Locate static output
        id: out
        run: |
          DIR=$(dirname "$(find dist .output -name index.html -not -path '*/node_modules/*' 2>/dev/null | head -n 1)")
          if [ -z "$DIR" ] || [ ! -f "$DIR/index.html" ]; then
            echo "No prerendered index.html found"; ls -R dist .output 2>/dev/null | head -50; exit 1
          fi
          echo "Static output: $DIR"; ls -la "$DIR"
          cp "$DIR/index.html" "$DIR/404.html"
          touch "$DIR/.nojekyll"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
